<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Roll - Chúc Tết</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        @font-face {
            font-family: 'candy_cake';
            src: url('assets/fonts/Candy_Cake.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Dongle';
            src: url('assets/fonts/Dongle-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .my-candy-cake {
            font-family: 'candy_cake' !important;
            font-weight: normal;
            font-style: normal;
        }

        .my-korea-font {
            font-family: 'Dongle' !important;
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Landing page responsive backgrounds */
        .landing-bg {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('/assets/img/desktop.png');
            z-index: 0;
        }

        @media (max-width: 768px) {
            .landing-bg {
                background-image: url('/assets/img/phone.png');
            }
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Film roll container */
        .film-roll-wrapper {
            position: absolute;
            top: 40%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 375px;
            overflow: hidden;
            z-index: 5;
        }

        @media (max-width: 768px) {
            .film-roll-wrapper {
                height: 200px;
                top: 50%;
            }
        }

        .film-roll {
            position: absolute;
            display: flex;
            gap: 30px;
            height: 100%;
            animation: scrollFilm 30s linear infinite;
        }

        .film-strip {
            flex-shrink: 0;
            width: 300px;
            height: 375px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .film-roll {
                gap: 15px;
            }

            .film-strip {
                width: 150px;
                height: 200px;
            }
        }

        @keyframes scrollFilm {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }

        @keyframes scrollFilmMobile {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }

        .film-frame {
            width: 100%;
            height: 100%;
            background: #000;
            border: 10px solid #333;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .film-frame {
                border: 4px solid #333;
                border-radius: 5px;
            }

            .film-frame img {
                width: 120px !important;
                height: 160px !important;
                border-radius: 3px;
            }
        }

        /* Film holes effect */
        .film-frame::before,
        .film-frame::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #666;
            border-radius: 50%;
            display: none;
        }

        .film-frame::before {
            top: 10px;
            left: 10px;
            box-shadow: 0 40px 0 #666, 0 80px 0 #666, 0 120px 0 #666, 0 160px 0 #666, 0 200px 0 #666;
        }

        .film-frame::after {
            top: 10px;
            right: 10px;
            box-shadow: 0 40px 0 #666, 0 80px 0 #666, 0 120px 0 #666, 0 160px 0 #666, 0 200px 0 #666;
        }

        .film-frame img {
            width: 240px;
            height: 315px;
            object-fit: cover;
            /* position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); */
            border-radius: 5px;
        }

        /* Center indicator line */
        .center-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 300px;
            background: rgba(255, 255, 255, 0.5);
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            display: none;
        }

        @media (max-width: 768px) {
            .center-line {
                height: 200px;
            }
        }

        /* Peanut character */
        .peanut {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            cursor: pointer;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .peanut {
                width: 80px;
                height: 80px;
                bottom: 30px;
            }
        }

        .peanut img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        .peanut.jumping {
            animation: jumpMotion 0.6s ease-in-out;
        }

        @keyframes jumpMotion {
            0% {
                bottom: 50px;
            }

            50% {
                bottom: 400px;
            }

            100% {
                bottom: 50px;
            }
        }

        @media (max-width: 768px) {
            @keyframes jumpMotion {
                0% {
                    bottom: 30px;
                }

                50% {
                    bottom: 300px;
                }

                100% {
                    bottom: 30px;
                }
            }
        }

        /* Popup modal with frame */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .popup-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Frame popup container */
        .frame-popup-container {
            position: relative;
            max-width: 37.7rem;
            width: 90%;
            min-height: 48rem;
        }

        /* Frame overlay */
        .frame-overlay {
            position: absolute;
            inset: -2rem;
            background-image: url('/assets/img/new_new_frame.png');
            background-size: 100% auto;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            z-index: 11;
        }

        .popup-content {
            position: relative;
            width: 100%;
            z-index: 11;
            padding: 16rem 3rem 3rem;
            max-height: 70vh;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #wish-content-display {
            max-height: 21.5rem;
            padding-bottom: 6rem;
            overflow-y: auto;
            scrollbar-width: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #wish-content-display::-webkit-scrollbar {
            display: none;
        }

        .popup-content h2 {
            color: #e7dcff;
            font-size: 1.55rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        #modal-content {
            color: white;
            font-size: 1.625rem;
            line-height: 2.1rem;
            white-space: pre-wrap;
            text-align: justify;
        }

        .close-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 20;
            display: none;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            transform: scale(1.1);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .frame-popup-container {
                min-height: 25rem !important;
                width: 95%;
            }

            .frame-overlay {
                inset: -1rem;
                background-size: 90% auto !important;
            }

            .popup-content {
                padding: 8rem 2rem 2rem !important;
                max-height: 75vh !important;
            }

            #wish-content-display {
                max-height: 11.8rem !important;
            }

            .popup-content h2 {
                font-size: 1.25rem !important;
            }

            #modal-content {
                font-size: 1.125rem !important;
                line-height: 1.6rem !important;
            }

            #modal-content.my-candy-cake {
                font-size: 1rem !important;
            }

            .close-btn {
                top: 1rem;
                right: 1rem;
                width: 35px;
                height: 35px;
            }
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 50;
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .instructions {
                font-size: 14px;
                padding: 10px 20px;
                bottom: 10px;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* Title */
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 24px;
                top: 20px;
                width: 90%;
                text-align: center;
            }
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .text-red {
            color: #ef4444;
        }

        .font-bold {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Landing page background -->
    <div class="landing-bg"></div>

    <div class="container">
        <h1 class="title" hidden>🎊 Chúc Mừng Năm Mới 2026 🎊</h1>

        <div class="film-roll-wrapper">
            <div class="center-line" hiddens></div>
            <div class="film-roll" id="filmRoll"></div>
        </div>

        <div class="peanut" id="peanut">
            <img src="/assets/img/peanut.png" alt="Peanut">
        </div>

        <div class="instructions" hidden>
            🥜 Nhấn SPACE hoặc Click củ lạc để nhảy lên! 🥜
        </div>
    </div>

    <!-- Popup with Frame -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="frame-popup-container">
            <div class="popup-content">
                <button class="close-btn" id="closeBtn">
                    <span class="material-symbols-outlined">close</span>
                </button>

                <div id="wish-content-display">
                    <div class="text-center mb-4">
                        <h2 class="my-candy-cake">Từ: <span id="modal-username" class="text-red font-bold"></span></h2>
                    </div>
                    <div class="text-center">
                        <div id="modal-content"></div>
                    </div>
                    <div id="modal-image-container" class="hidden" style="margin-top: 1rem;">
                        <img id="modal-image" src="" alt="Wish image"
                            style="width: 100%; max-width: 400px; margin: 0 auto; display: block; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2);" />
                    </div>
                </div>
            </div>

            <!-- Frame overlay -->
            <div class="frame-overlay"></div>
        </div>
    </div>

    <script type="module" src="/js/landing-page-peanut.js"></script>
</body>

</html>
